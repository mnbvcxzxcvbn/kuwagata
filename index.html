<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>クワガタチキン</title>
<style>
  :root {
    --bg: #1d2a1a;
    --panel: #2b3b26;
    --text: #f3f0e0;
    --muted: #b9c2a8;
    --accent: #f2c14e;
    --danger: #e5484d;
    --good: #6fcf75;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; padding: 12px 16px; gap: 8px;
  }
  h1 { margin: 4px 0 0; font-size: 22px; letter-spacing: .05em; }
  #hud {
    display: flex; gap: 16px; font-size: 14px; color: var(--muted);
  }
  #hud b { color: var(--accent); font-variant-numeric: tabular-nums; }
  #stage {
    position: relative; flex: 1; width: 100%; max-width: 520px; min-height: 0;
    touch-action: none; cursor: pointer;
  }
  canvas { width: 100%; height: 100%; display: block; border-radius: 16px; background: #3a2c1c; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 18px; font-weight: bold; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.7);
  }
  #result {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: rgba(10, 14, 8, .72); border-radius: 16px; text-align: center; padding: 16px;
  }
  #result.show { display: flex; }
  #rTitle { font-size: 30px; font-weight: 900; }
  #rScore { font-size: 44px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  #rSub { font-size: 15px; color: var(--muted); }
  #rRank { font-size: 18px; margin-top: 4px; }
  #again {
    margin-top: 14px; font-size: 18px; font-weight: bold; padding: 12px 28px;
    border: none; border-radius: 999px; background: var(--accent); color: #2a2110; cursor: pointer;
  }
  #rules { font-size: 12px; color: var(--muted); text-align: center; max-width: 520px; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🪲 クワガタチキン</h1>
  <div id="hud">
    <span>ベスト: <b id="best">---</b></span>
    <span>挑戦: <b id="tries">0</b></span>
    <span>挟まれ: <b id="pinched">0</b></span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="msg">画面を長押しして、指をアゴの間に置こう</div>
    <div id="result">
      <div id="rTitle"></div>
      <div id="rScore"></div>
      <div id="rSub"></div>
      <div id="rRank"></div>
      <button id="again">もう一回</button>
    </div>
  </div>
  <div id="rules">
    長押しで指を置き、クワガタが挟む<b>直前</b>に離そう。<br>
    スコア＝離してから挟まれるまでの残り時間（小さいほど上手）。フェイントに注意！
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const result = document.getElementById('result');
  const rTitle = document.getElementById('rTitle');
  const rScore = document.getElementById('rScore');
  const rSub = document.getElementById('rSub');
  const rRank = document.getElementById('rRank');
  const againBtn = document.getElementById('again');
  const bestEl = document.getElementById('best');
  const triesEl = document.getElementById('tries');
  const pinchedEl = document.getElementById('pinched');

  // ---- 保存データ ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem('kuwagata:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('kuwagata:' + k, JSON.stringify(v)); } catch {} },
  };
  let best = store.get('best', null);
  let tries = store.get('tries', 0);
  let pinchedCount = store.get('pinched', 0);
  function refreshHud() {
    bestEl.textContent = best === null ? '---' : best.toFixed(3) + '秒';
    triesEl.textContent = tries;
    pinchedEl.textContent = pinchedCount;
  }
  refreshHud();

  // ---- キャンバス ----
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- ゲーム定数 ----
  const OPEN = 1.0;          // アゴ全開
  const WINDUP_MS = 260;     // 挟む前の溜め（少し開く）
  const CLOSE_MS = 140;      // 閉じる速さ
  const MIN_SNAP = 2.5, MAX_SNAP = 11; // 挟むまでの秒数（ランダム）

  // ---- 状態 ----
  // idle: 待機 / holding: 指を置いている / released: 指を離した（クワガタはまだ挟んでない）/ done: 結果表示
  let state = 'idle';
  let pressAt = 0, snapAt = 0, releaseAt = 0;
  let fakes = [];   // フェイントの予定 {at, kind, dur}
  let jaw = OPEN;   // 0=閉, 1=開, >1 さらに開く
  let shake = 0;
  let flash = 0;
  let pinched = false;
  let fingerY = 1;  // 0=アゴの間, 1=画面外

  function now() { return performance.now(); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function scheduleFakes(total) {
    fakes = [];
    let t = rand(0.6, 1.6);
    while (t < total - 0.5) {
      const r = Math.random();
      let kind, dur;
      if (r < 0.4) { kind = 'twitch'; dur = rand(0.12, 0.25); }      // ピクッと少し閉じる
      else if (r < 0.75) { kind = 'windup'; dur = rand(0.25, 0.45); } // 本番と同じ溜め→何もしない
      else { kind = 'half'; dur = rand(0.25, 0.4); }                // 半分まで閉じて戻す
      fakes.push({ at: t * 1000, kind, dur: dur * 1000 });
      t += rand(0.7, 2.2);
    }
  }

  function startHold() {
    if (state !== 'idle') return;
    state = 'holding';
    pinched = false;
    pressAt = now();
    const secs = rand(MIN_SNAP, MAX_SNAP);
    snapAt = pressAt + secs * 1000;
    scheduleFakes(secs);
    msg.textContent = 'ギリギリまで我慢…！';
  }

  function release() {
    if (state !== 'holding') return;
    const t = now();
    if (t >= snapAt) return; // もう挟まれている
    state = 'released';
    releaseAt = t;
    msg.textContent = '';
  }

  function finish(wasPinched) {
    state = 'done';
    tries++;
    if (wasPinched) {
      pinchedCount++;
      rTitle.textContent = '挟まれた！！';
      rTitle.style.color = 'var(--danger)';
      rScore.textContent = 'いたっ';
      rSub.textContent = `指を置いてから ${((snapAt - pressAt) / 1000).toFixed(2)} 秒で挟まれた`;
      rRank.textContent = 'スコアなし';
    } else {
      const remain = (snapAt - releaseAt) / 1000;
      let isBest = false;
      if (best === null || remain < best) { best = remain; isBest = true; }
      rTitle.textContent = isBest ? 'ベスト更新！' : 'セーフ！';
      rTitle.style.color = isBest ? 'var(--accent)' : 'var(--good)';
      rScore.textContent = remain.toFixed(3) + ' 秒';
      rSub.textContent = `挟まれるまでの残り時間（我慢した時間 ${((releaseAt - pressAt) / 1000).toFixed(2)} 秒）`;
      rRank.textContent = rank(remain);
    }
    store.set('best', best); store.set('tries', tries); store.set('pinched', pinchedCount);
    refreshHud();
    setTimeout(() => result.classList.add('show'), wasPinched ? 700 : 500);
  }

  function rank(s) {
    if (s < 0.05) return '神の指 🏆';
    if (s < 0.15) return '達人 🥇';
    if (s < 0.4) return 'なかなかの度胸 🥈';
    if (s < 1.0) return 'まずまず 🥉';
    if (s < 3.0) return 'ちょっとビビり';
    return 'チキン 🐔';
  }

  function reset() {
    result.classList.remove('show');
    state = 'idle';
    jaw = OPEN; pinched = false; flash = 0;
    msg.textContent = '画面を長押しして、指をアゴの間に置こう';
  }

  // ---- 入力 ----
  stage.addEventListener('pointerdown', e => {
    if (e.target === againBtn) return;
    if (state !== 'idle') return;
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch {}
    startHold();
  });
  const up = () => release();
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  window.addEventListener('blur', up);
  stage.addEventListener('contextmenu', e => e.preventDefault());
  // キーボード（スペース）でも遊べる
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    e.preventDefault();
    if (state === 'done') { reset(); return; }
    startHold();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });
  againBtn.addEventListener('click', e => { e.stopPropagation(); reset(); });
  againBtn.addEventListener('pointerdown', e => e.stopPropagation());

  // ---- アゴの開き具合を計算 ----
  function easeIn(x) { return x * x * x; }
  function jawAt(t) {
    // t: pressAt からの経過 ms
    const snapT = snapAt - pressAt;
    if (t >= snapT) return 0;
    const windStart = snapT - CLOSE_MS - WINDUP_MS;
    if (t >= snapT - CLOSE_MS) {
      const p = (t - (snapT - CLOSE_MS)) / CLOSE_MS;
      return 1.18 * (1 - easeIn(p));
    }
    if (t >= windStart) {
      const p = (t - windStart) / WINDUP_MS;
      return 1 + 0.18 * Math.sin(p * Math.PI / 2);
    }
    for (const f of fakes) {
      if (t >= f.at && t < f.at + f.dur) {
        const p = (t - f.at) / f.dur;
        const bump = Math.sin(p * Math.PI);
        if (f.kind === 'twitch') return 1 - 0.18 * bump;
        if (f.kind === 'windup') return 1 + 0.18 * bump;
        if (f.kind === 'half') return 1 - 0.45 * bump;
      }
    }
    // 常に少し震える
    return 1 + Math.sin(t / 37) * 0.012 + Math.sin(t / 91) * 0.01;
  }

  // ---- 描画 ----
  function drawMandible(cx, cy, side, open, s) {
    // side: -1 左, +1 右
    ctx.save();
    ctx.translate(cx + side * 34 * s, cy);
    const ang = side * (0.08 + open * 0.42);
    ctx.rotate(ang);
    ctx.scale(side, 1);
    const g = ctx.createLinearGradient(0, 0, 40 * s, -200 * s);
    g.addColorStop(0, '#3b1d0d'); g.addColorStop(1, '#7a3e1b');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#1a0b04'; ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(-14 * s, 0);
    ctx.bezierCurveTo(-10 * s, -70 * s, 30 * s, -130 * s, 6 * s, -205 * s); // 外側カーブ
    ctx.bezierCurveTo(-4 * s, -215 * s, -20 * s, -200 * s, -22 * s, -190 * s); // 先端
    ctx.bezierCurveTo(-10 * s, -150 * s, -6 * s, -110 * s, -30 * s, -80 * s); // 内側
    // 内歯
    ctx.lineTo(-44 * s, -86 * s);
    ctx.lineTo(-30 * s, -66 * s);
    ctx.bezierCurveTo(-34 * s, -40 * s, -30 * s, -15 * s, -22 * s, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 光沢
    ctx.strokeStyle = 'rgba(255,200,150,.25)'; ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(0, -20 * s);
    ctx.bezierCurveTo(4 * s, -80 * s, 18 * s, -130 * s, 4 * s, -185 * s);
    ctx.stroke();
    ctx.restore();
  }

  function drawBeetle(cx, cy, open, s, t) {
    // 脚
    ctx.strokeStyle = '#140904'; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const y0 = cy + (60 + i * 55) * s;
        const wig = Math.sin(t / 120 + i + side) * 3 * s;
        ctx.beginPath();
        ctx.moveTo(cx + side * 55 * s, y0);
        ctx.lineTo(cx + side * (120 + i * 10) * s, y0 + (i - 1) * 30 * s + wig);
        ctx.lineTo(cx + side * (150 + i * 12) * s, y0 + (i - 0.5) * 60 * s + wig);
        ctx.stroke();
      }
    }
    // 腹（羽）
    const bg = ctx.createRadialGradient(cx - 30 * s, cy + 130 * s, 10 * s, cx, cy + 170 * s, 160 * s);
    bg.addColorStop(0, '#5a2f16'); bg.addColorStop(1, '#1f0e05');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 190 * s, 82 * s, 130 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0d0603'; ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(cx, cy + 80 * s); ctx.lineTo(cx, cy + 318 * s); ctx.stroke();
    // 胸
    const pg = ctx.createRadialGradient(cx - 20 * s, cy + 40 * s, 5 * s, cx, cy + 55 * s, 90 * s);
    pg.addColorStop(0, '#6b3a1c'); pg.addColorStop(1, '#241006');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(cx, cy + 55 * s, 78 * s, 40 * s, 0, 0, Math.PI * 2); ctx.fill();
    // アゴ
    drawMandible(cx, cy - 8 * s, -1, open, s);
    drawMandible(cx, cy - 8 * s, 1, open, s);
    // 頭
    const hg = ctx.createRadialGradient(cx - 15 * s, cy - 10 * s, 5 * s, cx, cy, 70 * s);
    hg.addColorStop(0, '#6e3b1c'); hg.addColorStop(1, '#221006');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(cx, cy, 66 * s, 32 * s, 0, 0, Math.PI * 2); ctx.fill();
    // 目
    ctx.fillStyle = '#0a0503';
    for (const side of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(cx + side * 56 * s, cy - 6 * s, 8 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(cx + side * 54 * s, cy - 8 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0503';
    }
    // 触角
    ctx.strokeStyle = '#1a0b04'; ctx.lineWidth = 2.5 * s;
    for (const side of [-1, 1]) {
      const tw = Math.sin(t / 200 + side) * 4 * s;
      ctx.beginPath();
      ctx.moveTo(cx + side * 40 * s, cy - 18 * s);
      ctx.lineTo(cx + side * 70 * s, cy - 40 * s + tw);
      ctx.lineTo(cx + side * 92 * s, cy - 34 * s + tw);
      ctx.stroke();
    }
  }

  function drawFinger(cx, tipY, s, hurt) {
    const w = 44 * s;
    ctx.save();
    const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    g.addColorStop(0, hurt ? '#e0907a' : '#e8b593');
    g.addColorStop(0.5, hurt ? '#f2a088' : '#f6cfb0');
    g.addColorStop(1, hurt ? '#c9715c' : '#d39b78');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#8a5a40'; ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, H + 20);
    ctx.lineTo(cx - w / 2, tipY + w / 2);
    ctx.arc(cx, tipY + w / 2, w / 2, Math.PI, 0);
    ctx.lineTo(cx + w / 2, H + 20);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 爪（指はクワガタ側＝上を向いているので爪は見えない側。しわを描く）
    ctx.strokeStyle = 'rgba(120,70,50,.45)'; ctx.lineWidth = 1.5 * s;
    for (const dy of [60, 66, 120, 126]) {
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.3, tipY + dy * s);
      ctx.quadraticCurveTo(cx, tipY + (dy + 4) * s, cx + w * 0.3, tipY + dy * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  let last = now();
  function frame() {
    const t = now();
    const dt = Math.min(50, t - last); last = t;

    // 状態更新
    if (state === 'holding' || state === 'released') {
      const el = t - pressAt;
      jaw = jawAt(el);
      if (t >= snapAt) {
        jaw = 0;
        if (state === 'holding') {
          pinched = true; shake = 18; flash = 1;
          msg.textContent = '';
          finish(true);
        } else {
          shake = 6;
          finish(false);
        }
      }
    } else if (state === 'idle') {
      jaw += (OPEN - jaw) * 0.15;
      jaw += Math.sin(t / 300) * 0.002;
    }

    // 指の位置
    const fingerTarget = (state === 'holding' || (state === 'done' && pinched)) ? 0 : 1;
    const speed = fingerTarget === 0 ? 0.25 : 0.35;
    fingerY += (fingerTarget - fingerY) * speed;

    // 描画
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // 木の幹の背景
    const bg = ctx.createLinearGradient(0, 0, W, 0);
    bg.addColorStop(0, '#3a2a19'); bg.addColorStop(0.5, '#4a3621'); bg.addColorStop(1, '#3a2a19');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const x = (i + 0.5) * W / 9;
      ctx.beginPath(); ctx.moveTo(x, 0);
      ctx.bezierCurveTo(x + 12, H * 0.3, x - 12, H * 0.6, x + 6, H); ctx.stroke();
    }

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86; if (shake < 0.3) shake = 0;
    }
    const s = Math.min(W / 420, H / 640);
    const cx = W / 2;
    const cy = H * 0.12 + 215 * s; // 頭の位置（アゴは上に伸びる）
    // 上下反転してアゴを下向きに：クワガタは画面上側、アゴが下向き
    // 指：アゴの間（頭の下 ~150px）まで伸びる
    const gapY = cy + 120 * s;
    const tipY = gapY + fingerY * (H - gapY + 60 * s);
    drawFinger(cx, tipY, s, pinched);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, -1);
    ctx.translate(-cx, -cy);
    // 反転後は頭がcy、アゴは下方向へ伸びる
    drawBeetle(cx, cy, Math.max(0, jaw), s, t);
    ctx.restore();


    // 挟まれ演出
    if (pinched && state === 'done') {
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${42 * s}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('バチン！', cx, gapY - 10 * s);
    }
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(229,72,77,${flash * 0.55})`;
      ctx.fillRect(0, 0, W, H);
      flash -= dt / 500; if (flash < 0) flash = 0;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
